<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700,900&display=swap" id="font">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
	<link rel="stylesheet" type="text/css" href="main.css">
	<title>DeiTsuki redisign - TREW UI</title>
</head>
<body style="font-family: 'Montserrat'">
	<!-- Hidden until client/client.lua un-hides it on esx:onPlayerSpawn / esx:playerLoaded.
	     Inline style so the HUD can never paint before the NUI message arrives. -->
	<div id="ui" style="display:none;">
		<div class="info server-name" id="serverName">
			<span class="server-name-text">Sappy City RP</span>
		</div>
		<div class="info cash" id="cashPanel">
			<ul class="money-list">
				<li class="money-line" id="wallet">
					<i class="fas fa-wallet money-icon"></i>
					<span class="money-label">Cash</span>
					<span class="money-value">$0</span>
				</li>
				<li class="money-line" id="bank">
					<i class="fas fa-university money-icon"></i>
					<span class="money-label">Bank</span>
					<span class="money-value">$0</span>
				</li>
			</ul>
		</div>
		<div class="info player" id="playerPanel">
			<div id="name" style="display:block;"><span>Name</span></div>
			<div id="status">
				<ul id="ths">
					<li class="icon" id="thirst" style="display:block;"><i class="fas fa-tint"></i><span></span></li>
					<li class="icon" id="hunger" style="display:block;"><i class="fas fa-utensils"></i><span></span></li>
					<div class="playerInfos">
						<p id="job"><span>Jobname</span></p>
						<p id="age"><span>Age</span></p>
					</div>
				</ul>
				<ul id="haa">
					<div class="c"></div>
					<li class="icon" id="armor" style="display:block;"><i class="fas fa-shield-alt"></i><span></span></li>
					<li class="icon" id="health" style="display:block;"><i class="fas fa-heart"></i><span></span></li>
				</ul>
			</div>
		</div>
		<div class="info vehicle inactive animated faster">
			<div id="speedometer">
				<div id="progress-speed">
					<svg viewBox="0 0 100 100">
						<circle cx="50" cy="50" r="45" class="mask" />
						<circle cx="50" cy="50" r="45" class="speed zero" />
					</svg>
				</div>
				<div id="vehicle-speed">
					<span>999</span>
					<strong>KM/H</strong>
				</div>
				<div id="vehicle-gear" class="icon text">
					<i><img src="img/vehicle-gear.png"></i><span>N</span>
				</div>
				<div id="vehicle-others" class="icon" style="display:block;">
					<i class="fas fa-biking" style="color: #fff;"></i>
				</div>
				<div id="vehicle-status-left">
					<ul>
						<li class="icon" id="fuel"><i class="fas fa-gas-pump"></i><span></span></li>
						<li class="icon" id="fuel"><i class="fas fa-gas-pump"></i></li>
						<li class="icon normal" id="lights"><i class="fas fa-lightbulb"></i><span></span></li>
						<li class="icon off" id="seatbelt"><i class="fas fa-link"></i><span></span></li>
					</ul>
				</div>
				<div id="vehicle-status-right">
					<ul class="signal">
						<li class="icon" id="signalLeft" class="off"><i class="fas fa-arrow-left"></i><span></span></li>
						<li class="icon" id="signalRight" class="off"><i class="fas fa-arrow-right"></i><span></span></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="info weapon animated faster unarmed" id="weapon" style="display:block;">
			<div id="weapon_image">
				<img src="img/weapons/pistol.png" alt="">
			</div>
			<div id="weapon_bullets">
				<div id="weapon_clip" class="clip"><span>999</span></div>
				<div id="weapon_ammo" class="ammo"><span>999</span></div>
			</div>
			<div class="icon" id="bullets">
				<i><img src="img/weapon-bullets.png" alt=""></i>
				<i class="clone"><img src="img/weapon-bullets.png" alt=""></i>
				<span></span>
			</div>
		</div>
		<div class="info radio">
			<div id="voice" style="display:block;"><i class="fas fa-microphone-alt"></i></div>
		</div>
		<audio id="sounds"><source type="audio/ogg"></audio>
	</div>
	<script src="https://cdn.jsdelivr.net/gh/cferdinandi/saferInnerHTML@1/dist/saferInnerHTML.polyfills.min.js"></script>	
	<script src="app.js"></script>
</body>
</html>
